name: Release

on:
  release:
    types: [released]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rust-binaries:
    name: Rust ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: carve-mcp-rs-x86_64-unknown-linux-gnu.tar.gz
            binary: carve-mcp-rs
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: carve-mcp-rs-x86_64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: macos-15
            target: aarch64-apple-darwin
            archive: carve-mcp-rs-aarch64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: carve-mcp-rs-x86_64-pc-windows-msvc.zip
            binary: carve-mcp-rs.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        run: tar czf "${{ matrix.archive }}" -C "rust/target/${{ matrix.target }}/release" "${{ matrix.binary }}"
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"
      - name: Upload release binary
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.archive }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm install --global npm@latest
      - name: Verify release candidate
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUIRE_RELEASE_TAG: "1"
      # npm cannot issue a package's FIRST publish over OIDC (npm/cli#8544), so
      # 0.1.0 is published by hand and this job would otherwise die on a 403 for
      # an already-published version, taking the Registry step below with it.
      # The skip also makes a re-run after a failed later step harmless.
      - name: Publish npm package with provenance
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "@markup-carve/carve-mcp@$version" version >/dev/null 2>&1; then
            echo "npm already serves $version; skipping publish."
            exit 0
          fi
          npm publish --access public --provenance
      - name: Verify clean npm installation
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5; do
            if npx --yes --package "@markup-carve/carve-mcp@$version" carve-mcp </dev/null; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Install MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          version=1.8.1
          base="https://github.com/modelcontextprotocol/registry/releases/download/v$version"
          curl --fail --location --silent --show-error --output publisher.tar.gz \
            "$base/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output checksums.txt \
            "$base/registry_${version}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' checksums.txt \
            | sed 's#mcp-publisher_linux_amd64.tar.gz#publisher.tar.gz#' \
            | sha256sum --check --strict
          tar xzf publisher.tar.gz mcp-publisher
      - name: Publish official MCP Registry entry
        shell: bash
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
