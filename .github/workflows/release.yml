name: Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to verify and finish
        required: true
        default: 0.1.0

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  rust-binaries:
    if: github.event_name == 'release'
    name: Rust ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: carve-mcp-rs-x86_64-unknown-linux-gnu.tar.gz
            binary: carve-mcp-rs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: carve-mcp-rs-x86_64-unknown-linux-musl.tar.gz
            binary: carve-mcp-rs
            install_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: carve-mcp-rs-aarch64-unknown-linux-gnu.tar.gz
            binary: carve-mcp-rs
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: carve-mcp-rs-x86_64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: macos-15
            target: aarch64-apple-darwin
            archive: carve-mcp-rs-aarch64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: carve-mcp-rs-x86_64-pc-windows-msvc.zip
            binary: carve-mcp-rs.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        run: tar czf "${{ matrix.archive }}" -C "rust/target/${{ matrix.target }}/release" "${{ matrix.binary }}"
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"
      - name: Upload release binary
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.archive }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The smoke check reads the tool contract out of dist/, so it cannot drift
      # from the server it is checking.
      - run: npm run build
      - name: Verify downloaded Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-smoke
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "${{ matrix.archive }}" --dir release-smoke
          tar xzf "release-smoke/${{ matrix.archive }}" -C release-smoke
          node scripts/release-binary-smoke.mjs "release-smoke/${{ matrix.binary }}" --full
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Verify downloaded Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-smoke
          gh release download "${{ github.event.release.tag_name }}" `
            --pattern "${{ matrix.archive }}" --dir release-smoke
          Expand-Archive "release-smoke/${{ matrix.archive }}" -DestinationPath release-smoke
          node scripts/release-binary-smoke.mjs "release-smoke/${{ matrix.binary }}" --full
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  release-checksums:
    if: github.event_name == 'release'
    needs: rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: scripts/release-checksums.sh "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  npm-credential:
    name: The npm credential can publish this package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # GATE, and a separate job on purpose. The first irreversible act in this
      # workflow is `npm publish` itself, so the publish job has to depend on a
      # job it cannot reach past. Written as a step inside the publish job it
      # would be skippable while the job still reported green, which is the
      # shape that shipped a vulnerable carve-py in this organization.
      #
      # WHY IT EXISTS. carve-grammars v0.1.13, 2026-10-08: every gate passed,
      # the release was approved, the tag was created, Packagist served it
      # within two minutes, and then `npm publish` answered
      # "404 Not Found - PUT" on the package URL. npm answers 404 rather than
      # 403 for a scoped package so it does not leak existence, so that is an
      # authorization failure and not a missing package: 0.1.11 was serving at
      # the time. The result was a version on Packagist that npm did not have.
      # A credential is checkable without publishing anything, and it was the
      # one precondition no gate checked.
      #
      # Nothing below publishes, changes or deprecates anything.
      - name: The token is live and can write this package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not readable from this repository, so the publish cannot authenticate at all."
            exit 1
          fi

          # FATAL. An expired, revoked or malformed token fails here with
          # 401 / ENEEDAUTH, and this is the one probe below whose failure is
          # unambiguous.
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm rejected the credential: ${who}"
            echo "::error::rotate NPM_TOKEN before releasing. A 404 on PUT is an auth failure, not a missing package."
            exit 1
          fi
          echo "authenticated as ${who}"

          pkg="$(node -p "require('./package.json').name")"
          echo "package under release: ${pkg}"

          # REPORTED, NOT FATAL, and measured rather than assumed. This is the
          # organization endpoint /-/org/<scope>/package, an org read and not a
          # package write. On carve-wasm run 32156381782 this organization's
          # NPM_TOKEN answered 403 "You may not perform that action with these
          # credentials" here, while an anonymous GET of the same URL returned
          # the whole scope. A credential with fewer rights than a stranger on
          # an org endpoint is the signature of a granular access token, which
          # says nothing about whether it can publish. Made fatal, as the first
          # draft of this gate had it, this would refuse every release in this
          # organization.
          echo "== packages this credential can see in the scope"
          if ! npm access list packages 2>&1; then
            echo "  REFUSED on the org endpoint. An anonymous reader is not refused here, so this"
            echo "  is about the credential's kind, not about the scope being unreachable."
          fi

          # The discriminator, and the reason the two probes above are not
          # enough. A classic automation token can read this endpoint and a
          # granular one cannot. A classic token carries its owner's publish
          # rights, so with a read-write grant below the publish is as proven
          # as it gets without publishing. A granular token's package grants
          # are fixed when it is created and are not readable from here at all,
          # which is the residual risk this gate cannot close.
          echo "== the kind of credential"
          if npm token list >/dev/null 2>&1; then
            echo "  classic automation token: it carries the owner's publish rights."
          else
            echo "  granular access token: its package grants are fixed at creation and cannot be"
            echo "  read from here. If this package is not among them the publish fails with E404"
            echo "  and no change in this repository can fix it. Check the token at npmjs.com."
          fi

          # FATAL ONLY ON A DEFINITE NEGATIVE. Note what this is and is not:
          # the collaborators endpoint is a PUBLIC read, so it reports the npm
          # USER's grant on the package and not the token's. A read-only grant
          # therefore means the publish cannot succeed whatever the token is,
          # which is worth stopping for; read-write does not prove the token
          # inherits it, which is why it is not reported as a pass.
          echo "== the account's grant on the package"
          if grants="$(npm access list collaborators "${pkg}" --json 2>/dev/null)"; then
            mine="$(printf '%s' "${grants}" | jq -r --arg u "${who}" '.[$u] // "not listed"')"
            echo "  ${who}: ${mine}"
            if [ "${mine}" = "read-only" ]; then
              echo "::error::${who} holds read-only access to ${pkg}, so the publish cannot succeed."
              echo "::error::grant write access or rotate NPM_TOKEN before releasing."
              exit 1
            fi
          else
            echo "  the endpoint did not answer, which does not distinguish 'no permission' from"
            echo "  'no such package', so it is not treated as a verdict."
          fi

  publish:
    if: github.event_name == 'release'
    needs: [release-checksums, npm-credential]
    runs-on: ubuntu-latest
    # Room for the clean-install check to sit out npm's propagation window.
    timeout-minutes: 35
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Pinned, not floating: npm 12 changed `npm pack --json` from an array to
      # an object, which broke the 0.1.0 release run. Trusted publishing needs
      # npm 11.5.1 or newer, so this cannot simply use the bundled npm.
      - run: npm install --global npm@12.0.2
      - name: Verify release candidate
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUIRE_RELEASE_TAG: "1"
      # npm cannot issue a package's FIRST publish over OIDC (npm/cli#8544), so
      # 0.1.0 is published by hand and this job would otherwise die on a 403 for
      # an already-published version, taking the Registry step below with it.
      # The skip also makes a re-run after a failed later step harmless.
      - name: Publish npm package with provenance
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "@markup-carve/carve-mcp@$version" version >/dev/null 2>&1; then
            echo "npm already serves $version; skipping publish."
            exit 0
          fi
          npm publish --access public --provenance
        # setup-node wrote an .npmrc that reads NODE_AUTH_TOKEN. Secrets are not
        # injected automatically, so without this mapping the token expands to
        # empty and the publish fails to authenticate. NPM_TOKEN is inherited
        # from the organization. Provenance still applies: it comes from the
        # job's id-token permission, not from how npm authenticates.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify clean npm installation
        shell: bash
        run: scripts/verify-published-install.sh @markup-carve/carve-mcp "$RELEASE_TAG" carve-mcp
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Publish official MCP Registry entry
        run: scripts/publish-registry.sh

  release-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      full: ${{ steps.contract.outputs.full }}
    steps:
      - name: Detect the released native contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          musl=false
          arm64=false
          grep -qx 'carve-mcp-rs-x86_64-unknown-linux-musl.tar.gz' <<<"$assets" && musl=true
          grep -qx 'carve-mcp-rs-aarch64-unknown-linux-gnu.tar.gz' <<<"$assets" && arm64=true
          if [[ "$musl" == true && "$arm64" == true ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          elif [[ "$musl" == false && "$arm64" == false ]]; then
            echo 'full=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Release has an incomplete current native artifact set.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}

  verify-released-binaries:
    if: github.event_name == 'workflow_dispatch'
    needs: release-contract
    name: Verify ${{ matrix.target }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: carve-mcp-rs-x86_64-unknown-linux-gnu.tar.gz
            binary: carve-mcp-rs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: carve-mcp-rs-x86_64-unknown-linux-musl.tar.gz
            binary: carve-mcp-rs
            current_only: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: carve-mcp-rs-aarch64-unknown-linux-gnu.tar.gz
            binary: carve-mcp-rs
            current_only: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: carve-mcp-rs-x86_64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: macos-15
            target: aarch64-apple-darwin
            archive: carve-mcp-rs-aarch64-apple-darwin.tar.gz
            binary: carve-mcp-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: carve-mcp-rs-x86_64-pc-windows-msvc.zip
            binary: carve-mcp-rs.exe
    steps:
      - name: Skip current-only artifact for a legacy release
        if: matrix.current_only && needs.release-contract.outputs.full != 'true'
        run: echo 'This legacy release predates the expanded Linux artifact set.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !matrix.current_only || needs.release-contract.outputs.full == 'true' }}
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !matrix.current_only || needs.release-contract.outputs.full == 'true' }}
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: ${{ !matrix.current_only || needs.release-contract.outputs.full == 'true' }}
      - run: npm run build
        if: ${{ !matrix.current_only || needs.release-contract.outputs.full == 'true' }}
      - name: Download and verify Unix binary
        if: runner.os != 'Windows' && (!matrix.current_only || needs.release-contract.outputs.full == 'true')
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-smoke
          gh release download "${{ inputs.release_tag }}" \
            --pattern "${{ matrix.archive }}" --dir release-smoke
          tar xzf "release-smoke/${{ matrix.archive }}" -C release-smoke
          args=()
          [[ "$FULL_CONTRACT" == true ]] && args+=(--full)
          node scripts/release-binary-smoke.mjs "release-smoke/${{ matrix.binary }}" "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FULL_CONTRACT: ${{ needs.release-contract.outputs.full }}
      - name: Download and verify Windows binary
        if: runner.os == 'Windows' && (!matrix.current_only || needs.release-contract.outputs.full == 'true')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-smoke
          gh release download "${{ inputs.release_tag }}" `
            --pattern "${{ matrix.archive }}" --dir release-smoke
          Expand-Archive "release-smoke/${{ matrix.archive }}" -DestinationPath release-smoke
          $args = @()
          if ("${{ needs.release-contract.outputs.full }}" -eq "true") { $args += "--full" }
          node scripts/release-binary-smoke.mjs "release-smoke/${{ matrix.binary }}" @args
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}

  recover-release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-released-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify repository and published package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(npm view "@markup-carve/carve-mcp@$version" version)" = "$version"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          # Recovery runs from main so it can use repaired release tooling.
          # Only metadata-equivalent application releases may be recovered.
          git diff --exit-code "$RELEASE_TAG" -- \
            src package.json package-lock.json server.json rust/Cargo.toml rust/Cargo.lock
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: scripts/release-checksums.sh "${{ inputs.release_tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish official MCP Registry entry
        run: scripts/publish-registry.sh
