name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:workflow
      - run: node scripts/release-check.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo package --manifest-path rust/Cargo.toml --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:rust-resources
      - run: npm run test:rust-conformance

  rust-release-targets:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            install_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag carve-mcp:ci .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker run --detach --rm --publish 3000:3000 \
            --env CARVE_MCP_TOKEN=ci-smoke-token carve-mcp:ci)"
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep "$attempt"
          done
          docker logs "$container"
          exit 1
