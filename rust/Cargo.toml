[package]
name = "carve-mcp"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Native MCP server for the Carve markup language"
license = "MIT"
repository = "https://github.com/markup-carve/carve-mcp"
homepage = "https://markup-carve.github.io/carve/"
readme = "README.md"
keywords = ["carve", "markup", "mcp", "parser"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
atomic-write-file = "0.3.1"
carve-lang = "=0.1.4"
rmcp = { version = "3.2.0", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
similar = "2.7.0"

[[bin]]
name = "carve-mcp-rs"
path = "src/main.rs"
